/* ============================================================
   CHARTS (hand-rolled SVG — no external chart lib)
   ============================================================ */
function ScoreRing({ value = 0, size = 132, stroke = 12, label = "Overall", showGrade = true }) {
  const v = clamp(value);
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const off = c * (1 - v / 100);
  const col = bandColor(v);
  return (
    <div className="relative inline-grid place-items-center" style={{ width: size, height: size }}>
      <svg width={size} height={size} className="-rotate-90">
        <circle cx={size / 2} cy={size / 2} r={r} stroke="#e2e8f0" strokeWidth={stroke} fill="none" />
        <circle cx={size / 2} cy={size / 2} r={r} stroke={col} strokeWidth={stroke} fill="none"
          strokeDasharray={c} strokeDashoffset={off} strokeLinecap="round"
          style={{ transition: "stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)" }} />
      </svg>
      <div className="absolute text-center">
        <div className="text-3xl font-extrabold tabular" style={{ color: col }}>{v}<span className="text-base font-semibold text-slate-400">%</span></div>
        {showGrade && <div className="text-[10px] uppercase tracking-wide text-slate-400 font-semibold">{label}</div>}
      </div>
    </div>
  );
}

function SectionBars({ data = [] }) {
  if (!data.length) return <div className="text-sm text-slate-400">No section data.</div>;
  return (
    <div className="space-y-3">
      {data.map((d) => (
        <div key={d.label}>
          <div className="flex justify-between text-sm mb-1">
            <span className="font-medium text-slate-600">{d.label}</span>
            <span className={"font-bold tabular " + bandText(d.value)}>{d.value}%</span>
          </div>
          <div className="h-2.5 rounded-full bg-slate-100 overflow-hidden">
            <div className={"h-full rounded-full " + bandBg(d.value)} style={{ width: d.value + "%", transition: "width .9s cubic-bezier(.2,.8,.2,1)" }} />
          </div>
        </div>
      ))}
    </div>
  );
}

function RadarChart({ axes = [], size = 260 }) {
  const n = axes.length;
  if (n < 3) return <SectionBars data={axes} />;
  const cx = size / 2, cy = size / 2, R = size / 2 - 38;
  const ang = (i) => -Math.PI / 2 + (i * 2 * Math.PI) / n;
  const pt = (i, val) => [cx + (R * val / 100) * Math.cos(ang(i)), cy + (R * val / 100) * Math.sin(ang(i))];
  const poly = axes.map((a, i) => pt(i, clamp(a.value)).join(",")).join(" ");
  return (
    <svg width={size} height={size} className="mx-auto">
      {[25, 50, 75, 100].map((ring) => (
        <polygon key={ring} fill="none" stroke="#e2e8f0" strokeWidth="1"
          points={axes.map((_, i) => pt(i, ring).join(",")).join(" ")} />
      ))}
      {axes.map((_, i) => { const [x, y] = pt(i, 100); return <line key={i} x1={cx} y1={cy} x2={x} y2={y} stroke="#e2e8f0" />; })}
      <polygon points={poly} fill="rgba(14,165,233,.18)" stroke="#0ea5e9" strokeWidth="2" />
      {axes.map((a, i) => { const [x, y] = pt(i, clamp(a.value)); return <circle key={i} cx={x} cy={y} r="3.5" fill="#0ea5e9" />; })}
      {axes.map((a, i) => {
        const [x, y] = pt(i, 118);
        return <text key={i} x={x} y={y} fontSize="10.5" fontWeight="600" fill="#64748b" textAnchor="middle" dominantBaseline="middle">{a.label}</text>;
      })}
    </svg>
  );
}

function LineTrend({ points = [], width = 560, height = 210, yMax = 100 }) {
  const pl = 34, pr = 14, pt = 14, pb = 26;
  const W = width - pl - pr, H = height - pt - pb;
  if (points.length === 0) return <div className="text-sm text-slate-400 p-6 text-center">No attempts yet — your trend will appear here.</div>;
  const xAt = (i) => pl + (points.length === 1 ? W / 2 : (i * W) / (points.length - 1));
  const yAt = (v) => pt + H - (clamp(v, 0, yMax) / yMax) * H;
  const line = points.map((p, i) => `${xAt(i)},${yAt(p.value)}`).join(" ");
  const area = `${pl},${pt + H} ${line} ${xAt(points.length - 1)},${pt + H}`;
  const everyN = Math.ceil(points.length / 8);
  return (
    <svg width="100%" viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="xMidYMid meet">
      {[0, 25, 50, 75, 100].map((g) => (
        <g key={g}>
          <line x1={pl} y1={yAt(g)} x2={width - pr} y2={yAt(g)} stroke="#eef2f7" />
          <text x={pl - 6} y={yAt(g)} fontSize="9" fill="#94a3b8" textAnchor="end" dominantBaseline="middle">{g}</text>
        </g>
      ))}
      <polygon points={area} fill="rgba(14,165,233,.12)" />
      <polyline points={line} fill="none" stroke="#0ea5e9" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
      {points.map((p, i) => (
        <g key={i}>
          <circle cx={xAt(i)} cy={yAt(p.value)} r="3.5" fill="#fff" stroke="#0ea5e9" strokeWidth="2" />
          {i % everyN === 0 && <text x={xAt(i)} y={height - 8} fontSize="9" fill="#94a3b8" textAnchor="middle">{p.label}</text>}
        </g>
      ))}
    </svg>
  );
}

function Donut({ segments = [], size = 150, stroke = 20 }) {
  const total = segments.reduce((s, x) => s + x.value, 0) || 1;
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  let acc = 0;
  return (
    <div className="flex items-center gap-4">
      <svg width={size} height={size} className="-rotate-90">
        <circle cx={size / 2} cy={size / 2} r={r} stroke="#f1f5f9" strokeWidth={stroke} fill="none" />
        {segments.map((s, i) => {
          const frac = s.value / total, dash = `${c * frac} ${c}`, offset = -c * acc; acc += frac;
          return <circle key={i} cx={size / 2} cy={size / 2} r={r} stroke={s.color} strokeWidth={stroke} fill="none"
            strokeDasharray={dash} strokeDashoffset={offset} />;
        })}
      </svg>
      <div className="space-y-1.5">
        {segments.map((s, i) => (
          <div key={i} className="flex items-center gap-2 text-sm">
            <span className="w-3 h-3 rounded-sm" style={{ background: s.color }} />
            <span className="text-slate-600">{s.label}</span>
            <span className="font-bold text-slate-800 tabular">{s.value}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function blueprintFor(tier, isCheckpoint) {
  const base = {
    1: { grammar: 4, vocab: 4, reading: 3, sjt: 2, email: 1 },
    2: { grammar: 5, vocab: 4, reading: 3, sjt: 3, email: 1 },

  }[tier];
  if (isCheckpoint) return { grammar: base.grammar + 1, vocab: base.vocab + 1, reading: base.reading, sjt: base.sjt + 1, email: 1 };
  return base;
}

/* ============================================================
   EXAM BUILDER — samples a question set from the bank
   ============================================================ */
function pickByDiff(pool, diff, n) {
  let elig = pool.filter((x) => x.diff <= diff);
  if (elig.length < n) elig = pool; // fallback so sets always fill
  return sample(elig, n);
}
function buildExam(set) {
  const items = [];
  pickByDiff(GRAMMAR, set.diff, set.blueprint.grammar).forEach((g) =>
    items.push({ iid: uid(), section: "grammar", type: "mcq", q: g.q, options: g.options, answer: g.answer, explain: g.explain }));
  pickByDiff(VOCAB, set.diff, set.blueprint.vocab).forEach((v) =>
    items.push({ iid: uid(), section: "vocab", type: "mcq", q: v.q, options: v.options, answer: v.answer, explain: v.explain }));
  // reading: choose whole passages until we reach target sub-question count
  let need = set.blueprint.reading;
  const passages = shuffle(READING.filter((p) => p.diff <= set.diff));
  const usePassages = passages.length ? passages : READING;
  for (const p of usePassages) {
    if (need <= 0) break;
    p.subs.slice(0, Math.max(1, need)).forEach((sub) =>
      items.push({ iid: uid(), section: "reading", type: "mcq", passageId: p.id, passageTitle: p.title, passage: p.passage, q: sub.q, options: sub.options, answer: sub.answer, explain: sub.explain }));
    need -= p.subs.length;
  }
  pickByDiff(SJT, set.diff, set.blueprint.sjt).forEach((s) =>
    items.push({ iid: uid(), section: "sjt", type: "sjt", q: s.q, options: s.options, best: s.best, explain: s.explain }));
  if (set.blueprint.email > 0) {
    const e = pickByDiff(EMAILS, set.diff, 1)[0];
    items.push({ iid: uid(), section: "email", type: "email", prompt: e.prompt, minWords: e.minWords, keywords: e.keywords, explain: e.explain });
  }
  return items;
}

/* ============================================================
   AI LAYER — swappable Claude API with offline fallback
   ------------------------------------------------------------
   • If a proxy URL or API key is saved in Settings, requests go
     to the real Anthropic API (or your proxy).
   • Otherwise, deterministic OFFLINE generators run so every
     feature works with zero configuration and zero network.
   ============================================================ */
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const aiEnabled = (s) => !!(s && (s.apiKey || s.proxyUrl));

function extractText(data) {
  if (!data) throw new Error("empty response");
  if (typeof data.text === "string") return data.text;
  if (Array.isArray(data.content)) return data.content.map((c) => c.text || "").join("").trim();
  if (data.completion) return data.completion;
  if (data.message && Array.isArray(data.message.content)) return data.message.content.map((c) => c.text || "").join("");
  throw new Error("could not parse model response");
}
async function callClaude({ system, messages, settings, maxTokens = 512 }) {
  const model = (settings && settings.model) || "claude-sonnet-4-6";
  if (settings && settings.proxyUrl) {
    const res = await fetch(settings.proxyUrl, {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ model, system, messages, max_tokens: maxTokens }),
    });
    if (!res.ok) throw new Error("proxy error " + res.status);
    return extractText(await res.json());
  }
  if (settings && settings.apiKey) {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": settings.apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify({ model, max_tokens: maxTokens, system, messages }),
    });
    if (!res.ok) throw new Error("API error " + res.status);
    return extractText(await res.json());
  }
  throw new Error("offline");
}

const DRILLS = {
  grammar: ["Review subject–verb agreement and tense consistency; rewrite 5 customer sentences daily.", "Practice spotting the one wrong word in a sentence — error-correction drills build accuracy."],
  vocab: ["Build a 'service vocabulary' list (escalate, verify, refund, discrepancy) and use each in a sentence.", "Learn 5 formal alternatives to casual words (e.g., 'want to' not 'wanna') each day."],
  reading: ["Practice skimming for key facts (amounts, dates, policies), then answer without re-reading.", "After each passage, summarize it in one sentence to test comprehension."],
  sjt: ["For each scenario, ask: did I acknowledge emotion, follow policy, and confirm next steps?", "Study the CARE model: Connect, Acknowledge, Resolve, End positively."],
  email: ["Always include a greeting, a clear action/answer, a courteous tone, and a professional sign-off.", "Keep sentences short; lead with the resolution, then the details."],
};
function describeItem(item, userAns) {
  if (item.type === "mcq") {
    return `Question: ${item.q}\nOptions: ${item.options.map((o, i) => `${i + 1}) ${o}`).join("  ")}\nCorrect: ${item.options[item.answer]}\nStudent chose: ${userAns != null ? item.options[userAns] : "(none)"}`;
  }
  if (item.type === "sjt") {
    return `Scenario: ${item.q}\nBest action: ${item.options[item.best].text}\nStudent chose: ${userAns != null ? item.options[userAns].text : "(none)"}`;
  }
  return `Email task: ${item.prompt}`;
}
function offlineExplain(item, userAns) {
  if (item.type === "mcq") {
    const correct = item.options[item.answer];
    const right = userAns === item.answer;
    const yours = userAns != null && item.options[userAns] != null ? item.options[userAns] : "(no answer)";
    return `${right ? "✓ Correct." : "✗ Not quite."} The correct answer is “${correct}”.${right ? "" : ` You chose “${yours}”.`}\n\n${item.explain}`;
  }
  if (item.type === "sjt") {
    const best = item.options[item.best].text;
    const chosen = userAns != null ? item.options[userAns] : null;
    return `Best response: “${best}”.${chosen ? ` Your choice scored ${chosen.score}/100.` : ""}\n\n${item.explain}`;
  }
  return item.explain || "";
}
function analyzeResult(result) {
  const sorted = [...result.sections].sort((a, b) => a.score - b.score);
  return { weak: sorted.filter((s) => s.score < 70), strong: sorted.filter((s) => s.score >= 85), lowest: sorted[0], highest: sorted[sorted.length - 1] };
}
function offlineCoach(result) {
  const a = analyzeResult(result);
  let out = `You scored ${result.overall}% overall — ${result.grade || gradeFromScore(result.overall)}.\n\n`;
  if (a.strong.length) out += `Strengths: ${a.strong.map((s) => `${s.label} (${s.score}%)`).join(", ")}. Excellent work here.\n\n`;
  if (a.weak.length) {
    out += "Focus areas:\n";
    a.weak.forEach((s) => { out += `• ${s.label} — ${s.score}%. ${(DRILLS[s.key] || ["Practice targeted exercises."])[0]}\n`; });
  } else {
    out += "No weak areas detected — consider attempting a higher tier to keep challenging yourself.\n";
  }
  if (a.lowest) out += `\nNext step: revisit the ${a.lowest.label} items in your review, then re-attempt to confirm improvement.`;
  return out;
}
function detectHits(scenario, allUserText) {
  const t = (allUserText || "").toLowerCase();
  const k = scenario.keywords;
  return { empathy: k.empathy.some((w) => t.includes(w)), action: k.action.some((w) => t.includes(w)), close: k.close.some((w) => t.includes(w)) };
}
function scenarioNudge(scenario) {
  return pick([
    "So… what can you do about this for me?",
    "I just want this sorted out. Can you help or not?",
    "Okay, I'm listening. What happens next?",
  ]);
}
function offlineCustomerReply(scenario, history, userMsg) {
  const allUser = history.filter((m) => m.role === "user").map((m) => m.text).concat(userMsg || "").join(" ");
  const hits = detectHits(scenario, allUser);
  const turn = history.filter((m) => m.role === "user").length + 1;
  const score = (hits.empathy ? 34 : 0) + (hits.action ? 40 : 0) + (hits.close ? 26 : 0);
  let reply, done = false;
  if (hits.empathy && hits.action && (hits.close || turn >= 3)) {
    reply = pick(["Okay, thank you — that makes me feel a lot better. I appreciate you sorting this out.", "Alright, that works for me. Thanks for handling it so quickly.", "Great, thanks for understanding and actually helping. That's all I needed."]);
    done = true;
  } else if (hits.action && !hits.empathy) {
    reply = pick(["Okay… but you could at least acknowledge how frustrating this has been.", "Fine, but a bit of empathy would go a long way here."]);
  } else if (hits.empathy && !hits.action) {
    reply = pick(["I appreciate the apology, but what are you actually going to DO about it?", "Thanks, but I need a real solution, not just sympathy."]);
  } else if (turn >= 4) {
    reply = pick(["We seem to be going in circles. Can you please just resolve this?", "I'm losing patience — I really need this fixed today."]);
  } else {
    reply = scenarioNudge(scenario);
  }
  return { reply, done, score, hits };
}

/* ============================================================
   SCORING ENGINE
   ============================================================ */
function scoreEmail(text, item) {
  text = (text || "").trim();
  const words = text ? text.split(/\s+/).length : 0;
  const lower = text.toLowerCase();
  const fb = [];
  let lenScore = 0;
  if (words >= item.minWords) lenScore = 30;
  else if (words > 0) { lenScore = Math.round((30 * words) / item.minWords); fb.push(`A bit short — aim for at least ${item.minWords} words (you wrote ${words}).`); }
  else fb.push("No response was written.");
  const hits = item.keywords.filter((k) => lower.includes(k));
  const kwScore = Math.round((40 * hits.length) / item.keywords.length);
  if (hits.length < item.keywords.length && words > 0) {
    const missing = item.keywords.filter((k) => !lower.includes(k));
    fb.push("Try to address: " + missing.slice(0, 5).join(", ") + ".");
  }
  let struct = 0;
  const hasGreet = /\b(hi|hello|dear|good (morning|afternoon|evening))\b/.test(lower);
  const hasClose = /(regards|sincerely|thank you|best wishes|warm regards|kind regards|cheers|best,)/.test(lower);
  if (hasGreet) struct += 10; else if (words > 0) fb.push("Open with a greeting (e.g., “Dear Mr. Lopez,”).");
  if (hasClose) struct += 10; else if (words > 0) fb.push("Close professionally (e.g., “Kind regards, …”).");
  const polite = /(please|thank|apolog|appreciate|sorry)/.test(lower);
  const polScore = polite ? 10 : 0;
  if (!polite && words > 0) fb.push("Use courteous language (please / thank you / apologies).");
  let penalty = 0;
  const letters = text.replace(/[^a-zA-Z]/g, "");
  if (letters && letters === letters.toUpperCase() && letters.length > 12) { penalty += 15; fb.push("Avoid writing in ALL CAPS — it reads as shouting."); }
  const score = clamp(lenScore + kwScore + struct + polScore - penalty);
  if (fb.length === 0) fb.push("Well structured, courteous, and on-topic — excellent work.");
  return { score, words, feedback: fb, detail: { lenScore, kwScore, struct, polScore, penalty, hits: hits.length, total: item.keywords.length } };
}

function gradeExam(items, answers, times) {
  times = times || {};
  const bySection = {};
  const detail = [];
  let correct = 0, incorrect = 0, skipped = 0;
  items.forEach((it) => {
    let earned = 0, isCorrect = false, answered = false, chosen = null, userText = null, emailFb = null;
    const a = answers[it.iid];
    if (it.type === "mcq") {
      if (a === undefined || a === null) skipped++;
      else { answered = true; chosen = a; if (a === it.answer) { earned = 100; isCorrect = true; correct++; } else incorrect++; }
    } else if (it.type === "sjt") {
      if (a === undefined || a === null) skipped++;
      else { answered = true; chosen = a; earned = it.options[a].score; if (a === it.best) { isCorrect = true; correct++; } else incorrect++; }
    } else if (it.type === "email") {
      userText = a || ""; const r = scoreEmail(userText, it); earned = r.score; emailFb = r;
      if (userText.trim()) { answered = true; if (earned >= 60) { isCorrect = true; correct++; } else incorrect++; } else skipped++;
    }
    if (!bySection[it.section]) bySection[it.section] = { sum: 0, count: 0 };
    bySection[it.section].sum += earned;
    bySection[it.section].count += 1;
    detail.push({ ...it, earned, isCorrect, answered, chosen, userText, emailFb, time: times[it.iid] || 0 });
  });
  const sections = Object.keys(bySection).map((k) => ({
    key: k, label: SECTION_META[k].label, weight: SECTION_META[k].weight,
    score: Math.round(bySection[k].sum / bySection[k].count),
  }));
  const wsum = sections.reduce((s, x) => s + x.weight, 0) || 1;
  const overall = Math.round(sections.reduce((s, x) => s + x.score * x.weight, 0) / wsum);
  return { overall, sections, items: detail, counts: { correct, incorrect, skipped, total: items.length } };
}

/* ============================================================
   EXAM ENGINE — reducer (timer, answers, flags, autosave-ready)
   ============================================================ */
function makeExamState(set, items) {
  return {
    setId: set.id, setTitle: set.title, tier: set.tier, minutes: set.minutes,
    items, index: 0, answers: {}, flags: {}, times: {},
    timeLeft: set.minutes * 60, startedAt: Date.now(), status: "active",
  };
}
function examReducer(state, action) {
  switch (action.type) {
    case "restore": return action.state;
    case "answer": return { ...state, answers: { ...state.answers, [action.iid]: action.value } };
    case "flag": { const f = { ...state.flags }; f[action.iid] = !f[action.iid]; return { ...state, flags: f }; }
    case "goto": return { ...state, index: clamp(action.index, 0, state.items.length - 1) };
    case "next": return { ...state, index: Math.min(state.index + 1, state.items.length - 1) };
    case "prev": return { ...state, index: Math.max(state.index - 1, 0) };
    case "tick": {
      if (state.status !== "active") return state;
      const left = state.timeLeft - 1;
      const cur = state.items[state.index];
      const times = { ...state.times, [cur.iid]: (state.times[cur.iid] || 0) + 1 };
      if (left <= 0) return { ...state, timeLeft: 0, times, status: "submitted" };
      return { ...state, timeLeft: left, times };
    }
    case "submit": return { ...state, status: "submitted" };
    default: return state;
  }
}

                <div className="flex items-center gap-2"><Icon name="keyboard" size={14} className="text-emerald-300" /> {stats.bestWpm != null ? stats.bestWpm + " WPM" : "No typing yet"}</div>
              </div>
            </div>
          </div>
        </div>

      {/* Stats */}
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <Card><StatTile icon="clipboard" tone="sky" value={stats.n} label="Exams taken" /></Card>
        <Card><StatTile icon="chart" tone="emerald" value={stats.avg != null ? stats.avg + "%" : "—"} label="Average score" /></Card>
        <Card><StatTile icon="trophy" tone="amber" value={stats.best != null ? stats.best + "%" : "—"} label="Best score" /></Card>
        <Card><StatTile icon="target" tone="indigo" value={stats.completed} label="Sets cleared" sub="of 20" /></Card>

      {/* Modules */}
      <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-3">
        <ModuleCard icon="brain" tone="indigo" title="AI Coach" sub="Personalized feedback" onClick={() => go("coach")} />
        <ModuleCard icon="chart" tone="sky" title="Deep Analysis" sub="Topic-wise breakdown" onClick={() => go("analysis")} />
        <ModuleCard icon="trending" tone="emerald" title="Progress" sub="Score trend over time" onClick={() => go("progress")} />
        <ModuleCard icon="settings" tone="slate" title="Settings" sub="Profile · AI · pass mark" onClick={onOpenSettings} />
      </div>

      {/* Sets by tier */}
      {[1, 2, 3].map((t) => (
        <div key={t}>
          <div className="flex items-center gap-3 mb-3 mt-2">
            <div className={`w-1.5 h-7 rounded-full bg-${tierTone(t)}-500`} />
            <h2 className="text-lg font-extrabold text-slate-800">{TIERS[t].name}</h2>
            <Badge tone={tierTone(t)}>Tier {t}</Badge>
            <span className="text-sm text-slate-400 hidden sm:block">{TIERS[t].desc}</span>
          </div>
          <div className="grid sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3">
            {byTier[t].map((set) => (
              <SetCard key={set.id} set={set} best={bestBySet[set.id]}
                hasActive={active && active.setId === set.id}
                onStart={() => onStartSet(set)} onResume={onResume} />
            ))}
          </div>
        </div>
      ))}
      <div className="text-center text-xs text-slate-400 pt-2 pb-6">
        {storeOK ? "Progress auto-saves to this browser." : "⚠ Storage unavailable — progress won't persist in this browser."} · Seed question bank — fully expandable in the source.
      </div>
    </div>
  );
}

function ExamView({ set, restoredState, settings, onFinish, onExit }) {
  const [state, dispatch] = useReducer(examReducer, null, () => restoredState || makeExamState(set, buildExam(set)));
  const [confirmSubmit, setConfirmSubmit] = useState(false);
  const [confirmExit, setConfirmExit] = useState(false);
  const [savedFlash, setSavedFlash] = useState(false);
  const submittedRef = useRef(false);
  const item = state.items[state.index];
  const total = state.items.length;
  const answeredCount = state.items.filter((it) => state.answers[it.iid] !== undefined && state.answers[it.iid] !== "").length;
  const flaggedCount = Object.values(state.flags).filter(Boolean).length;

  // timer
  useInterval(() => dispatch({ type: "tick" }), state.status === "active" ? 1000 : null);
  // autosave on changes
  useEffect(() => {
    if (state.status !== "active") return;
    saveActive(state);
    setSavedFlash(true);
    const t = setTimeout(() => setSavedFlash(false), 1200);
    return () => clearTimeout(t);
  }, [state.answers, state.flags, state.index]);
  // periodic autosave (captures timer)
  useInterval(() => { if (state.status === "active") saveActive(state); }, 15000);
  // handle submission
  useEffect(() => {
    if (state.status === "submitted" && !submittedRef.current) {
      submittedRef.current = true;
      const graded = gradeExam(state.items, state.answers, state.times);
      const passMark = settings.passMark || 70;
      const record = {
        id: uid(), kind: "exam", setId: state.setId, setTitle: state.setTitle, tier: state.tier,
        ts: Date.now(), overall: graded.overall, sections: graded.sections, counts: graded.counts,
        durationSec: state.minutes * 60 - state.timeLeft, grade: gradeFromScore(graded.overall),
        pass: graded.overall >= passMark, detail: graded.items, answers: state.answers,
      };
      clearActive();
      onFinish(record);
    }
  }, [state.status]);

  const setAns = (val) => dispatch({ type: "answer", iid: item.iid, value: val });
  // Keyboard shortcuts: ←/→ navigate, A–D or 1–4 answer, F flag (ignored while typing)
  useEffect(() => {
    const onKey = (e) => {
      if (state.status !== "active" || confirmSubmit || confirmExit) return;
      const tag = (e.target && e.target.tagName ? e.target.tagName : "").toLowerCase();
      if (tag === "textarea" || tag === "input") return;
      const k = (e.key || "").toLowerCase();
      if (e.key === "ArrowRight") { e.preventDefault(); dispatch({ type: "next" }); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); dispatch({ type: "prev" }); }
      else if (k === "f") { dispatch({ type: "flag", iid: item.iid }); }
      else if (item.type === "mcq" || item.type === "sjt") {
        const letter = "abcd".indexOf(k);
        const num = parseInt(e.key, 10);
        if (letter >= 0 && letter < item.options.length) setAns(letter);
        else if (num >= 1 && num <= item.options.length) setAns(num - 1);
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [item, state.index, state.status, confirmSubmit, confirmExit]);
  const low = state.timeLeft <= 60;

  return (
    <div className="bpo-fade">
      {/* Exam top bar */}
      <div className="sticky top-0 z-20 -mx-4 sm:-mx-6 px-4 sm:px-6 py-3 bg-white/90 backdrop-blur border-b border-slate-200 flex items-center gap-3 flex-wrap">
        <button onClick={() => setConfirmExit(true)} className="text-slate-500 hover:text-slate-800 inline-flex items-center gap-1.5 text-sm font-semibold"><Icon name="left" size={16} />Exit</button>
        <div className="hidden sm:block w-px h-6 bg-slate-200" />
        <div className="min-w-0">
          <div className="font-bold text-slate-800 truncate text-sm sm:text-base">{set.title}</div>
          <div className="text-xs text-slate-400">Question {state.index + 1} of {total} · {SECTION_META[item.section].label}</div>
        </div>
        <div className="ml-auto flex items-center gap-3">
          <span className={`text-xs font-medium inline-flex items-center gap-1 ${savedFlash ? "text-emerald-600" : "text-slate-300"}`}><Icon name="check" size={13} />{savedFlash ? "Saved" : "Auto-save"}</span>
          <div className={`tabular font-bold inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl ${low ? "bg-rose-50 text-rose-600 bpo-pulse" : "bg-slate-100 text-slate-700"}`}>
            <Icon name="clock" size={16} />{fmtClock(state.timeLeft)}
          </div>
        </div>
      </div>

      <div className="grid lg:grid-cols-[1fr_280px] gap-5 mt-5">
        {/* Question panel */}
        <div>
          <Card className="min-h-[60vh] flex flex-col">
            <div className="flex items-center justify-between">
              <SectionChip sec={item.section} />
              <button onClick={() => dispatch({ type: "flag", iid: item.iid })}
                className={`inline-flex items-center gap-1.5 text-sm font-semibold px-3 py-1.5 rounded-lg transition ${state.flags[item.iid] ? "bg-amber-100 text-amber-700" : "text-slate-400 hover:bg-slate-100"}`}>
                <Icon name="flag" size={15} fill={state.flags[item.iid] ? "currentColor" : "none"} />{state.flags[item.iid] ? "Flagged" : "Flag for review"}
              </button>
            </div>

            {item.type === "mcq" && item.passage && (
              <div className="mt-4 p-4 rounded-xl bg-slate-50 border border-slate-100">
                <div className="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1.5 flex items-center gap-1.5"><Icon name="book" size={13} />{item.passageTitle}</div>
                <p className="text-slate-700 text-sm leading-relaxed">{item.passage}</p>
              </div>
            )}

            <h2 className="text-lg sm:text-xl font-bold text-slate-800 mt-4 leading-snug">{item.type === "email" ? "Email Writing Task" : item.q}</h2>

            {(item.type === "mcq" || item.type === "sjt") && (
              <div className="space-y-2.5 mt-5">
                {item.options.map((opt, i) => (
                  <OptionButton key={i} label={String.fromCharCode(65 + i)}
                    text={item.type === "sjt" ? opt.text : opt}
                    selected={state.answers[item.iid] === i}
                    onClick={() => setAns(i)} />
                ))}
              </div>
            )}

            {item.type === "email" && (
              <div className="mt-3 flex-1 flex flex-col">
                <p className="text-slate-600">{item.prompt}</p>
                <div className="mt-2 text-xs text-slate-400 flex items-center gap-1.5"><Icon name="bulb" size={13} />Include a greeting, a clear resolution, a courteous tone, and a professional closing.</div>
                <textarea
                  value={state.answers[item.iid] || ""}
                  onChange={(e) => setAns(e.target.value)}
                  placeholder="Dear customer,&#10;&#10;Thank you for reaching out…"
                  className="mt-3 flex-1 min-h-[220px] w-full rounded-xl border border-slate-200 p-4 text-slate-700 leading-relaxed focus:border-sky-500 focus:ring-1 focus:ring-sky-500 outline-none resize-y" />
                <div className="text-xs text-slate-400 mt-1.5 text-right">{(state.answers[item.iid] || "").trim() ? (state.answers[item.iid].trim().split(/\s+/).length) : 0} words · target ≥ {item.minWords}</div>
              </div>
            )}

            {/* nav footer */}
            <div className="mt-auto pt-5 flex items-center gap-2">
              <Btn variant="outline" icon="left" disabled={state.index === 0} onClick={() => dispatch({ type: "prev" })}>Prev</Btn>
              <div className="ml-auto flex items-center gap-2">
                <Btn variant="soft" onClick={() => setConfirmSubmit(true)} icon="checkCircle">Review &amp; submit</Btn>
                {state.index < total - 1
                  ? <Btn variant="primary" iconRight="right" onClick={() => dispatch({ type: "next" })}>Next</Btn>
                  : <Btn variant="success" icon="check" onClick={() => setConfirmSubmit(true)}>Finish</Btn>}
              </div>
            </div>
          </Card>
        </div>

        {/* Navigator */}
        <div className="hidden lg:block">
          <Card className="sticky top-20">
            <div className="font-bold text-slate-800 text-sm mb-3">Question navigator</div>
            <div className="grid grid-cols-6 gap-1.5">
              {state.items.map((it, i) => {
                const ans = state.answers[it.iid] !== undefined && state.answers[it.iid] !== "";
                const cur = i === state.index;
                const fl = state.flags[it.iid];
                const cls = cur ? "bg-slate-900 text-white" : ans ? "bg-sky-500 text-white" : "bg-slate-100 text-slate-500 hover:bg-slate-200";
                return (
                  <button key={it.iid} onClick={() => dispatch({ type: "goto", index: i })}
                    className={`relative h-9 rounded-lg text-sm font-bold ${cls}`}>
                    {i + 1}
                    {fl && <span className="absolute -top-1 -right-1 w-2.5 h-2.5 rounded-full bg-amber-400 border-2 border-white" />}
                  </button>
                );
              })}
            </div>
            <div className="mt-4 space-y-1.5 text-xs text-slate-500">
              <div className="flex items-center gap-2"><span className="w-3 h-3 rounded bg-sky-500" />Answered ({answeredCount})</div>
              <div className="flex items-center gap-2"><span className="w-3 h-3 rounded bg-slate-200" />Unanswered ({total - answeredCount})</div>
              <div className="flex items-center gap-2"><span className="w-3 h-3 rounded-full bg-amber-400" />Flagged ({flaggedCount})</div>
            </div>
            <div className="mt-4 h-2 rounded-full bg-slate-100 overflow-hidden">
              <div className="h-full bg-sky-500 rounded-full" style={{ width: pct(answeredCount, total) + "%" }} />
            </div>
            <Btn variant="dark" full className="mt-4" icon="checkCircle" onClick={() => setConfirmSubmit(true)}>Submit exam</Btn>
            <div className="mt-3 text-[11px] text-slate-400 text-center leading-relaxed">⌨ <b className="text-slate-500">←/→</b> navigate · <b className="text-slate-500">A–D</b> answer · <b className="text-slate-500">F</b> flag</div>
          </Card>
        </div>
      </div>

      {/* Submit modal */}
      <Modal open={confirmSubmit} onClose={() => setConfirmSubmit(false)} title="Submit exam?" icon="checkCircle">
        <p className="text-slate-600">Review your status before submitting. You can't change answers after this.</p>
        <div className="grid grid-cols-3 gap-3 my-4">
          <div className="text-center p-3 rounded-xl bg-sky-50"><div className="text-2xl font-extrabold text-sky-600">{answeredCount}</div><div className="text-xs text-slate-500">Answered</div></div>
          <div className="text-center p-3 rounded-xl bg-slate-100"><div className="text-2xl font-extrabold text-slate-600">{total - answeredCount}</div><div className="text-xs text-slate-500">Unanswered</div></div>
          <div className="text-center p-3 rounded-xl bg-amber-50"><div className="text-2xl font-extrabold text-amber-600">{flaggedCount}</div><div className="text-xs text-slate-500">Flagged</div></div>
        </div>
        <div className="flex gap-2 justify-end">
          <Btn variant="outline" onClick={() => setConfirmSubmit(false)}>Keep working</Btn>
          <Btn variant="success" icon="check" onClick={() => { setConfirmSubmit(false); dispatch({ type: "submit" }); }}>Submit now</Btn>
        </div>
      </Modal>
      {/* Exit modal */}
      <Modal open={confirmExit} onClose={() => setConfirmExit(false)} title="Exit exam?" icon="alert">
        <p className="text-slate-600">Your progress is auto-saved — you can resume this exam later from the dashboard.</p>
        <div className="flex gap-2 justify-end mt-4">
          <Btn variant="outline" onClick={() => setConfirmExit(false)}>Stay</Btn>
          <Btn variant="danger" icon="logout" onClick={() => { saveActive(state); onExit(); }}>Save &amp; exit</Btn>
        </div>
      </Modal>
    </div>
  );
}

function ReviewItem({ it, idx, settings }) {

  const [exp, setExp] = useState(null);
  const [loading, setLoading] = useState(false);
  const correctTone = it.type === "email" ? (it.earned >= 60 ? "emerald" : "rose") : it.isCorrect ? "emerald" : it.answered ? "rose" : "slate";
  const loadExp = async () => {
    setOpen(true);
    if (exp || it.type === "email") return;
    setLoading(true);
    const txt = await getExplanation(it, it.chosen, settings);
    setExp(txt); setLoading(false);
  };
  return (
    <div className="border border-slate-200 rounded-xl overflow-hidden">
      <button onClick={() => (open ? setOpen(false) : loadExp())} className="w-full flex items-center gap-3 p-3.5 hover:bg-slate-50 text-left">
        <span className={`w-7 h-7 rounded-lg grid place-items-center text-white text-xs font-bold shrink-0 bg-${correctTone}-500`}>
          {it.type === "email" ? it.earned : it.isCorrect ? <Icon name="check" size={15} /> : it.answered ? <Icon name="x" size={15} /> : "–"}
        </span>
        <div className="min-w-0 flex-1">
          <div className="text-xs text-slate-400 font-semibold uppercase tracking-wide">{idx}. {SECTION_META[it.section].label}</div>
          <div className="text-sm font-medium text-slate-700 truncate">{it.type === "email" ? it.prompt : it.q}</div>
        </div>
        <Icon name={open ? "up" : "down"} size={16} className="text-slate-300 shrink-0" />
      </button>
      {open && (
        <div className="px-3.5 pb-4 pt-1 bg-slate-50/60 border-t border-slate-100 text-sm">
          {(it.type === "mcq") && (
            <div className="space-y-1.5 my-2">
              {it.options.map((o, i) => (
                <div key={i} className={`flex items-center gap-2 px-3 py-2 rounded-lg ${i === it.answer ? "bg-emerald-100 text-emerald-800 font-semibold" : i === it.chosen ? "bg-rose-100 text-rose-700" : "text-slate-500"}`}>
                  <span className="font-bold">{String.fromCharCode(65 + i)}.</span>{o}
                  {i === it.answer && <Icon name="check" size={14} className="ml-auto" />}
                  {i === it.chosen && i !== it.answer && <Icon name="x" size={14} className="ml-auto" />}
                </div>
              ))}
            </div>
          )}
          {it.type === "sjt" && (
            <div className="space-y-1.5 my-2">
              {it.options.map((o, i) => (
                <div key={i} className={`flex items-center gap-2 px-3 py-2 rounded-lg ${i === it.best ? "bg-emerald-100 text-emerald-800 font-semibold" : i === it.chosen ? "bg-amber-100 text-amber-800" : "text-slate-500"}`}>
                  <span className="font-bold">{String.fromCharCode(65 + i)}.</span>{o.text}
                  <span className="ml-auto text-xs font-bold tabular">{o.score}</span>
                </div>
              ))}
            </div>
          )}
          {it.type === "email" && (
            <div className="my-2">
              <div className="text-xs font-semibold text-slate-500 mb-1">Your response ({it.emailFb ? it.emailFb.words : 0} words · scored {it.earned}/100):</div>
              <div className="p-3 rounded-lg bg-white border border-slate-200 whitespace-pre-wrap text-slate-700 text-sm">{it.userText || <span className="text-slate-400 italic">No response written.</span>}</div>
              {it.emailFb && <ul className="mt-2 space-y-1">{it.emailFb.feedback.map((f, i) => <li key={i} className="flex gap-2 text-slate-600"><Icon name="arrowRight" size={14} className="text-sky-500 mt-0.5 shrink-0" />{f}</li>)}</ul>}
            </div>
          )}
          <div className="mt-2 p-3 rounded-lg bg-sky-50 border border-sky-100">
            <div className="text-xs font-bold text-sky-700 uppercase tracking-wide mb-1 flex items-center gap-1.5"><Icon name="bulb" size={13} />Explanation</div>
            {loading ? <div className="text-slate-400 flex items-center gap-2"><span className="w-4 h-4 border-2 border-slate-300 border-t-sky-500 rounded-full bpo-spin inline-block" />Generating…</div>
              : <div className="text-slate-700 whitespace-pre-wrap leading-relaxed">{it.type === "email" ? it.explain : (exp || it.explain)}</div>}
          </div>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   VIEW — AI COACH (chat)
   ============================================================ */
function offlineCoachReply(q, result) {
  const t = (q || "").toLowerCase();
  for (const key of Object.keys(DRILLS)) {
    if (t.includes(key) || t.includes(SECTION_META[key].label.toLowerCase().split(" ")[0])) return `For ${SECTION_META[key].label}:\n• ${DRILLS[key].join("\n• ")}`;
  }
  if (/typing|wpm|speed/.test(t)) return "Typing: practice 10 focused minutes daily, keep your fingers on the home row, prioritize accuracy over raw speed, and resist looking at the keyboard.";
  if (/chat|customer|angry|escalat|empath/.test(t)) return "Chat handling: acknowledge the emotion first, confirm the issue, offer a concrete solution, then close by confirming resolution. Empathy + action is the winning combination.";
  if (/(improve|study|plan|weak|better|score)/.test(t) && result) return offlineCoach(result);
  return "I can coach you on grammar, vocabulary, reading, situational judgment, email writing, typing, or chat handling — just ask. Or take a practice set and I'll analyze your results in detail.";
}
async function coachReply(q, history, result, settings) {
  if (aiEnabled(settings)) {
    try {
      const ctx = result ? `The candidate's latest result: ${result.overall}% overall; sections ${result.sections.map((s) => s.label + " " + s.score + "%").join(", ")}.` : "No exam taken yet.";
      const msgs = history.map((m) => ({ role: m.role === "user" ? "user" : "assistant", content: m.text })).concat([{ role: "user", content: q }]);
      return await callClaude({ system: `You are an encouraging, practical BPO English & communication coach. ${ctx} Give concise, actionable advice (a few short bullets max). Stay on assessment/communication topics.`, messages: msgs, settings, maxTokens: 500 });
    } catch (e) { return offlineCoachReply(q, result) + `\n\n(Offline coach — live AI unavailable.)`; }
  }
  return offlineCoachReply(q, result);
}

/* ============================================================
   VIEW — TYPING TEST (real WPM + accuracy)
   ============================================================ */
function TypingView({ settings, results, onSaveTyping, go }) {
  const [passage, setPassage] = useState(() => pick(TYPING_PASSAGES));
  const [input, setInput] = useState("");
  const [phase, setPhase] = useState("idle"); // idle | running | done
  const [start, setStart] = useState(null);
  const [elapsed, setElapsed] = useState(0);
  const [result, setResult] = useState(null);
  const areaRef = useRef(null);
  const best = useMemo(() => { const t = results.filter((r) => r.kind === "typing"); return t.length ? Math.max(...t.map((r) => r.wpm)) : null; }, [results]);

  const stats = useMemo(() => {
    const typed = input.length;
    let correct = 0;
    for (let i = 0; i < typed; i++) if (input[i] === passage[i]) correct++;
    const mins = Math.max(elapsed, 0.05) / 60;
    const wpm = Math.round((correct / 5) / mins) || 0;
    const gross = Math.round((typed / 5) / mins) || 0;
    const accuracy = typed ? Math.round((correct / typed) * 100) : 100;
    return { typed, correct, wpm, gross, accuracy, errors: typed - correct };
  }, [input, elapsed, passage]);

  useInterval(() => { if (phase === "running" && start) setElapsed((Date.now() - start) / 1000); }, phase === "running" ? 200 : null);

  const finish = useCallback(() => {
    setPhase("done");
    const rec = { id: uid(), kind: "typing", ts: Date.now(), wpm: stats.wpm, accuracy: stats.accuracy, errors: stats.errors, seconds: Math.round(elapsed), chars: stats.typed };
    setResult(rec); onSaveTyping(rec);
  }, [stats, elapsed, onSaveTyping]);

  const onChange = (e) => {
    if (phase === "done") return;
    const val = e.target.value;
    if (phase === "idle" && val.length > 0) { setPhase("running"); setStart(Date.now()); }
    if (val.length >= passage.length) { setInput(passage.slice(0)); setTimeout(() => finishWith(passage.slice(0)), 0); return; }
    setInput(val);
  };
  const finishWith = (finalInput) => {
    // recompute with final input synchronously
    let correct = 0; for (let i = 0; i < finalInput.length; i++) if (finalInput[i] === passage[i]) correct++;
    const secs = start ? (Date.now() - start) / 1000 : elapsed;
    const mins = Math.max(secs, 0.05) / 60;
    const wpm = Math.round((correct / 5) / mins) || 0;
    const accuracy = finalInput.length ? Math.round((correct / finalInput.length) * 100) : 100;
    setElapsed(secs); setPhase("done");
    const rec = { id: uid(), kind: "typing", ts: Date.now(), wpm, accuracy, errors: finalInput.length - correct, seconds: Math.round(secs), chars: finalInput.length };
    setResult(rec); onSaveTyping(rec);
  };
  const reset = (newPassage) => {
    setPassage(newPassage || passage); setInput(""); setPhase("idle"); setStart(null); setElapsed(0); setResult(null);
    setTimeout(() => areaRef.current && areaRef.current.focus(), 30);
  };

  return (
    <PageHeader title="Typing Test" icon="keyboard" go={go} badge={best != null ? <Badge tone="emerald"><Icon name="trophy" size={11} />Best {best} WPM</Badge> : null}>
      <div className="grid lg:grid-cols-3 gap-4 mb-4">
        <Card><StatTile icon="zap" tone="sky" value={phase === "done" && result ? result.wpm : stats.wpm} label="Words per minute" /></Card>
        <Card><StatTile icon="target" tone="emerald" value={(phase === "done" && result ? result.accuracy : stats.accuracy) + "%"} label="Accuracy" /></Card>
        <Card><StatTile icon="clock" tone="amber" value={fmtClock(phase === "done" && result ? result.seconds : elapsed)} label="Time" sub={stats.errors + " errors"} /></Card>
      </div>

      <Card>
        <div className="flex items-center justify-between mb-3">
          <h3 className="font-bold text-slate-800 flex items-center gap-2"><Icon name="book" size={18} className="text-sky-600" />Type the passage below</h3>
          <Btn variant="outline" size="sm" icon="refresh" onClick={() => reset(pick(TYPING_PASSAGES))}>New passage</Btn>
        </div>
        <div className="p-4 rounded-xl bg-slate-50 border border-slate-100 leading-loose text-[17px] font-mono select-none tracking-tight">
          {passage.split("").map((ch, i) => {
            let cls = "text-slate-400";
            if (i < input.length) cls = input[i] === ch ? "text-emerald-600" : "text-rose-600 bg-rose-100 rounded";
            else if (i === input.length && phase !== "done") cls = "text-slate-700 border-b-2 border-sky-500";
            return <span key={i} className={cls}>{ch}</span>;
          })}
        </div>
        {phase !== "done" ? (
          <textarea ref={areaRef} value={input} onChange={onChange} onPaste={(e) => e.preventDefault()} autoFocus spellCheck={false} autoComplete="off"
            placeholder="Click here and start typing… the timer starts on your first keystroke."
            className="mt-3 w-full min-h-[120px] rounded-xl border border-slate-200 p-4 font-mono text-slate-700 outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 resize-none" />
        ) : (
          <div className="mt-4 p-5 rounded-xl bg-gradient-to-br from-emerald-50 to-sky-50 border border-emerald-100 text-center bpo-pop">
            <Icon name="trophy" size={28} className="text-emerald-500 mx-auto" />
            <div className="text-3xl font-extrabold text-slate-800 mt-2">{result.wpm} WPM <span className="text-lg text-slate-400 font-bold">· {result.accuracy}% acc</span></div>
            <div className="text-sm text-slate-500 mt-1">{result.wpm >= 45 ? "Excellent — above typical BPO hiring benchmarks (35–40 WPM)." : result.wpm >= 30 ? "Solid pace — keep practicing toward 40+ WPM." : "Keep practicing — aim for accuracy first, speed will follow."}{best != null && result.wpm > best ? " 🎉 New personal best!" : ""}</div>
            <div className="flex gap-2 justify-center mt-4"><Btn variant="primary" icon="refresh" onClick={() => reset(pick(TYPING_PASSAGES))}>Try again</Btn><Btn variant="outline" icon="trending" onClick={() => go("progress")}>View progress</Btn></div>
          </div>
        )}
        {phase === "running" && <div className="mt-3 text-right"><Btn variant="soft" size="sm" icon="check" onClick={() => finishWith(input)}>Finish now</Btn></div>}
      </Card>
    </PageHeader>
  );
}

              <div key={i} className={`flex gap-2.5 ${m.role === "user" ? "justify-end" : ""}`}>
                {m.role !== "user" && <div className="w-8 h-8 rounded-full bg-slate-200 text-slate-500 grid place-items-center shrink-0"><Icon name="user" size={15} /></div>}
                <div className={`max-w-[78%] px-4 py-2.5 rounded-2xl leading-relaxed text-sm ${m.role === "user" ? "bg-sky-600 text-white rounded-br-md" : "bg-slate-100 text-slate-700 rounded-bl-md"}`}>{m.text}</div>
              </div>
            ))}
            {busy && <div className="flex gap-2.5"><div className="w-8 h-8 rounded-full bg-slate-200 text-slate-500 grid place-items-center"><Icon name="user" size={15} /></div><div className="bg-slate-100 px-4 py-3 rounded-2xl rounded-bl-md flex gap-1"><span className="w-2 h-2 bg-slate-400 rounded-full bpo-pulse" /><span className="w-2 h-2 bg-slate-400 rounded-full bpo-pulse" style={{ animationDelay: ".2s" }} /><span className="w-2 h-2 bg-slate-400 rounded-full bpo-pulse" style={{ animationDelay: ".4s" }} /></div></div>}
            {state.done && (
              <div className="p-4 rounded-xl bg-emerald-50 border border-emerald-100 text-center bpo-pop">
                <Icon name="checkCircle" size={26} className="text-emerald-500 mx-auto" />
                <div className="font-bold text-slate-800 mt-1">Customer resolved! Handling score: {state.score}/100</div>
                <div className="text-sm text-slate-500 mt-0.5">{state.score >= 80 ? "Outstanding customer handling." : state.score >= 60 ? "Good job — add a clearer close next time." : "Resolved, but aim for more empathy and a firm next step."}</div>
                <Btn variant="primary" size="sm" className="mt-3" icon="refresh" onClick={() => startScenario(scenario)}>Replay</Btn>
              </div>
            )}
            <div ref={endRef} />
          </div>
          <div className="border-t border-slate-100 p-3 flex gap-2">
            <input value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && send()} disabled={state.done} placeholder={state.done ? "Chat ended — replay to try again" : "Type your reply as the agent…"} className="flex-1 rounded-xl border border-slate-200 px-4 py-2.5 outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 disabled:bg-slate-50" />
            <Btn variant="primary" icon="send" onClick={send} disabled={busy || state.done || !input.trim()}>Send</Btn>
          </div>
        </Card>
        <div className="space-y-4">
          <Card>
            <div className="font-bold text-slate-800 text-sm mb-2">Live signals</div>
            <div className="flex flex-col gap-2">{signalBadge(state.hits.empathy, "Empathy shown")}{signalBadge(state.hits.action, "Action / solution offered")}{signalBadge(state.hits.close, "Closing / next step")}</div>
          </Card>
          <Card>
            <div className="font-bold text-slate-800 text-sm mb-2 flex items-center gap-1.5"><Icon name="target" size={15} className="text-indigo-500" />Your objectives</div>
            <ul className="space-y-1.5 text-sm text-slate-600">{scenario.goal.map((g, i) => <li key={i} className="flex gap-2"><Icon name="arrowRight" size={14} className="text-sky-500 mt-0.5 shrink-0" />{g}</li>)}</ul>
          </Card>
        </div>
      </div>
    </PageHeader>
  );
}

/* ============================================================
   VIEW — PROGRESS TRACKER
   ============================================================ */
function ProgressView({ results, go }) {
  const exam = useMemo(() => results.filter((r) => r.kind === "exam").sort((a, b) => a.ts - b.ts), [results]);
  const typing = useMemo(() => results.filter((r) => r.kind === "typing").sort((a, b) => a.ts - b.ts), [results]);
  const examPoints = exam.map((r, i) => ({ label: "#" + (i + 1), value: r.overall }));
  const typingPoints = typing.map((r, i) => ({ label: "#" + (i + 1), value: r.wpm }));

  return (
    <PageHeader title="Progress Tracker" icon="trending" go={go}>
      {!exam.length && !typing.length ? (
        <Card><Empty icon="trending" title="No history yet" sub="Take an exam or a typing test to start tracking progress." /><div className="text-center"><Btn icon="play" onClick={() => go("dashboard")}>Get started</Btn></div></Card>
      ) : (
        <div className="space-y-5">
          {exam.length > 0 && (
            <Card>
              <h3 className="font-bold text-slate-800 mb-1 flex items-center gap-2"><Icon name="chart" size={18} className="text-sky-600" />Exam score trend</h3>
              <p className="text-xs text-slate-400 mb-2">Overall % across {exam.length} attempt{exam.length > 1 ? "s" : ""}</p>
              <LineTrend points={examPoints} yMax={100} />
            </Card>
          )}
          {typing.length > 0 && (
            <Card>
              <h3 className="font-bold text-slate-800 mb-1 flex items-center gap-2"><Icon name="keyboard" size={18} className="text-emerald-600" />Typing speed trend</h3>
              <p className="text-xs text-slate-400 mb-2">WPM across {typing.length} test{typing.length > 1 ? "s" : ""}</p>
              <LineTrend points={typingPoints} yMax={Math.max(80, ...typing.map((t) => t.wpm + 10))} />
            </Card>
          )}
          {exam.length > 0 && (
            <Card pad={false}>
              <div className="p-5 pb-3"><h3 className="font-bold text-slate-800 flex items-center gap-2"><Icon name="list" size={18} className="text-indigo-600" />Attempt history</h3></div>
              <div className="overflow-x-auto">
                <table className="w-full text-sm">
                  <thead><tr className="text-left text-slate-400 border-y border-slate-100 text-xs uppercase tracking-wide"><th className="px-5 py-2 font-semibold">Date</th><th className="px-5 py-2 font-semibold">Set</th><th className="px-5 py-2 font-semibold">Score</th><th className="px-5 py-2 font-semibold">Result</th><th className="px-5 py-2 font-semibold">Time</th></tr></thead>
                  <tbody>
                    {[...exam].reverse().map((r) => (
                      <tr key={r.id} className="border-b border-slate-50 hover:bg-slate-50">
                        <td className="px-5 py-2.5 text-slate-500 whitespace-nowrap">{fmtDate(r.ts)}</td>
                        <td className="px-5 py-2.5 text-slate-700 font-medium">{r.setTitle.split("—")[1] ? r.setTitle.split("—")[1].trim() : r.setTitle}</td>
                        <td className={"px-5 py-2.5 font-bold tabular " + bandText(r.overall)}>{r.overall}%</td>
                        <td className="px-5 py-2.5">{r.pass ? <Badge tone="emerald"><Icon name="check" size={11} />Pass</Badge> : <Badge tone="rose"><Icon name="x" size={11} />Below</Badge>}</td>
                        <td className="px-5 py-2.5 text-slate-500 tabular whitespace-nowrap">{Math.floor(r.durationSec / 60)}m {r.durationSec % 60}s</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </Card>
          )}
        </div>
      )}
    </PageHeader>
  );
}

/* Shared page header for sub-views */
function PageHeader({ title, icon, go, badge, children }) {
  return (
    <div className="bpo-fade">
      <div className="flex items-center gap-3 mb-5">
        <button onClick={() => go("dashboard")} className="w-9 h-9 rounded-xl bg-white border border-slate-200 grid place-items-center text-slate-500 hover:text-slate-800 hover:bg-slate-50 shadow-sm"><Icon name="left" size={18} /></button>
        <div className="w-10 h-10 rounded-xl bg-slate-900 text-white grid place-items-center"><Icon name={icon} size={20} /></div>
        <h1 className="text-xl sm:text-2xl font-extrabold text-slate-800">{title}</h1>
        {badge && <div className="ml-auto">{badge}</div>}
      </div>
      {children}
    </div>
  );
}

/* ============================================================
   SETTINGS MODAL
   ============================================================ */
function AppSettings({ open, onClose, settings, onSave, onClearData }) {
  const [form, setForm] = useState(settings);
  useEffect(() => { setForm(settings); }, [settings, open]);
  const upd = (k, v) => setForm((f) => ({ ...f, [k]: v }));
  return (
    <Modal open={open} onClose={onClose} title="Settings" icon="settings" maxW="max-w-xl">
      <div className="space-y-5">
        <div>
          <label className="text-sm font-semibold text-slate-700">Candidate name</label>
          <input value={form.candidate} onChange={(e) => upd("candidate", e.target.value)} placeholder="Your name"
            className="mt-1.5 w-full rounded-xl border border-slate-200 px-4 py-2.5 outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500" />
        </div>
        <div>
          <label className="text-sm font-semibold text-slate-700">Pass mark: <span className="text-sky-600 font-bold">{form.passMark}%</span></label>
          <input type="range" min="50" max="90" value={form.passMark} onChange={(e) => upd("passMark", Number(e.target.value))} className="mt-2 w-full accent-sky-600" />
        </div>

        <div className="flex items-center justify-between pt-1">
          <button onClick={onClearData} className="text-sm font-semibold text-rose-600 hover:text-rose-700 inline-flex items-center gap-1.5"><Icon name="alert" size={15} />Clear all data</button>
          <div className="flex gap-2">
            <Btn variant="outline" onClick={onClose}>Cancel</Btn>
            <Btn variant="primary" icon="check" onClick={() => onSave(form)}>Save settings</Btn>
          </div>
        </div>
      </div>
    </Modal>
  );
}

/* ============================================================
   ERROR BOUNDARY
   ============================================================ */
class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  render() {
    if (this.state.err) {
      return (
        <div className="max-w-md mx-auto mt-20 p-6 bg-white rounded-2xl border border-rose-200 shadow text-center">
          <Icon name="alert" size={30} className="text-rose-500 mx-auto" />
          <h2 className="font-bold text-slate-800 mt-2">Something went wrong</h2>
          <p className="text-sm text-slate-500 mt-1">{String(this.state.err.message || this.state.err)}</p>
          <button onClick={() => location.reload()} className="mt-4 px-4 py-2 rounded-xl bg-sky-600 text-white font-semibold">Reload</button>
        </div>
      );
    }
    return this.props.children;
  }
}

/* ============================================================
   APP
   ============================================================ */
const NAV = [
  { view: "dashboard", icon: "dashboard", label: "Dashboard" },
  { view: "analysis", icon: "chart", label: "Analysis" },
  { view: "progress", icon: "trending", label: "Progress" },
  { view: "coach", icon: "brain", label: "AI Coach" },
];
function App() {
  const [view, setView] = useState("dashboard");
  const [settings, setSettings] = useState(loadSettings);
  const [results, setResults] = useState(loadResults);
  const [active, setActive] = useState(loadActive);
  const [exam, setExam] = useState(null); // { set, restored, key }
  const [result, setResult] = useState(null);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [confirmClear, setConfirmClear] = useState(false);

  useEffect(() => { const b = document.getElementById("boot"); if (b) b.remove(); }, []);
  useEffect(() => { if (!settings.candidate) setSettingsOpen(true); }, []); // first-run prompt

  const go = (v) => { setView(v); window.scrollTo({ top: 0, behavior: "smooth" }); };
  const startSet = (set) => { setExam({ set, restored: null, key: uid() }); go("exam"); };
  const resume = () => {
    if (!active) return;
    const set = SETS.find((s) => s.id === active.setId);
    setExam({ set, restored: active, key: "resume-" + active.startedAt }); go("exam");
  };
  const finishExam = (record) => {
    setResults(appendResult(record));
    setActive(null); setExam(null); setResult(record); go("result");
  };
  const exitExam = () => { setActive(loadActive()); setExam(null); go("dashboard"); };
  const saveSettingsHandler = (form) => { saveSettings(form); setSettings(form); setSettingsOpen(false); };
  const doClear = () => { clearResults(); clearActive(); setResults([]); setActive(null); setConfirmClear(false); setSettingsOpen(false); go("dashboard"); };
  const saveTyping = (rec) => setResults(appendResult(rec));

  const isExam = view === "exam";

  return (
    <ErrorBoundary>
      <div className="min-h-full">
        {!isExam && (
          <header className="sticky top-0 z-30 bg-white/80 backdrop-blur border-b border-slate-200">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center gap-3">
              <button onClick={() => go("dashboard")} className="flex items-center gap-2.5">
                <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-sky-500 to-indigo-600 grid place-items-center text-white shadow-sm"><Icon name="headset" size={20} /></div>
                <div className="text-left leading-none">
                  <div className="font-extrabold text-slate-800 tracking-tight">Vox<span className="text-sky-600">prep</span></div>
                  <div className="text-[10px] text-slate-400 font-semibold uppercase tracking-wide">BPO Exam Practice</div>
                </div>
              </button>
              <nav className="ml-4 hidden md:flex items-center gap-1">
                {NAV.map((n) => (
                  <button key={n.view} onClick={() => go(n.view)}
                    className={`px-3 py-2 rounded-xl text-sm font-semibold inline-flex items-center gap-2 transition ${view === n.view ? "bg-slate-900 text-white" : "text-slate-500 hover:bg-slate-100"}`}>
                    <Icon name={n.icon} size={16} />{n.label}
                  </button>
                ))}
              </nav>
              <div className="ml-auto flex items-center gap-2">
                <button onClick={() => setSettingsOpen(true)} className="w-9 h-9 rounded-xl grid place-items-center text-slate-500 hover:bg-slate-100"><Icon name="settings" size={19} /></button>
                <div className="w-9 h-9 rounded-xl bg-slate-100 grid place-items-center text-slate-500 font-bold text-sm" title={settings.candidate || "Candidate"}>{(settings.candidate || "C").trim().charAt(0).toUpperCase()}</div>
              </div>
            </div>
            {/* mobile nav */}
            <div className="md:hidden border-t border-slate-100 px-2 py-1.5 flex gap-1 overflow-x-auto">
              {NAV.map((n) => (
                <button key={n.view} onClick={() => go(n.view)} className={`px-3 py-1.5 rounded-lg text-xs font-semibold inline-flex items-center gap-1.5 whitespace-nowrap ${view === n.view ? "bg-slate-900 text-white" : "text-slate-500"}`}><Icon name={n.icon} size={14} />{n.label}</button>
              ))}
            </div>
          </header>
        )}

        <main className={`max-w-7xl mx-auto px-4 sm:px-6 ${isExam ? "py-0" : "py-6"}`}>
          {view === "dashboard" && <Dashboard settings={settings} results={results} active={active} go={go} onStartSet={startSet} onResume={resume} onOpenSettings={() => setSettingsOpen(true)} />}
          {view === "exam" && exam && <ExamView key={exam.key} set={exam.set} restoredState={exam.restored} settings={settings} onFinish={finishExam} onExit={exitExam} />}
          {view === "result" && result && <ResultView result={result} settings={settings} go={go} onRetake={(setId) => startSet(SETS.find((s) => s.id === setId))} onBack={() => go("dashboard")} />}
          {view === "analysis" && <AnalysisView results={results} settings={settings} go={go} />}
          {view === "coach" && <CoachView results={results} settings={settings} go={go} />}
          {view === "typing" && <TypingView settings={settings} results={results} onSaveTyping={saveTyping} go={go} />}
          {view === "chat" && <ChatView settings={settings} go={go} />}
          {view === "progress" && <ProgressView results={results} go={go} />}
          {view === "result" && !result && <Empty icon="info" title="No result to show" />}
        </main>

        <AppSettings open={settingsOpen} onClose={() => setSettingsOpen(false)} settings={settings} onSave={saveSettingsHandler} onClearData={() => setConfirmClear(true)} />
        <Modal open={confirmClear} onClose={() => setConfirmClear(false)} title="Clear all data?" icon="alert">
          <p className="text-slate-600">This permanently deletes all saved results, typing history, and in-progress exams from this browser.</p>
          <div className="flex gap-2 justify-end mt-4"><Btn variant="outline" onClick={() => setConfirmClear(false)}>Cancel</Btn><Btn variant="danger" icon="alert" onClick={doClear}>Delete everything</Btn></div>
        </Modal>
      </div>
    </ErrorBoundary>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
